name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
          - os: blacksmith-4vcpu-windows-2025
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev pkg-config gnome-keyring dbus

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        shell: bash
        run: |
          set -e
          combos=("" "--features updater" "--features screenshot" "--features screenshot,updater")
          # Perf mode times frames from the Windows window procedure.
          if [ "$RUNNER_OS" = "Windows" ]; then combos+=("--features perf"); fi
          for features in "${combos[@]}"; do
            echo "::group::cargo clippy --all-targets $features"
            cargo clippy --locked --all-targets $features
            echo "::endgroup::"
          done

      - name: Test
        shell: bash
        run: |
          tests='cargo test --locked && cargo test --locked --features updater'
          if [ "$RUNNER_OS" = "Linux" ]; then
            # The session tests use the OS keyring; Linux runners have no Secret Service.
            dbus-run-session -- sh -c "printf '' | gnome-keyring-daemon --unlock --components=secrets >/dev/null && $tests"
          else
            sh -c "$tests"
          fi
