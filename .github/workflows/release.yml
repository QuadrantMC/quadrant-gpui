name: Release

# A tag `v<version>` whose version equals Cargo.toml's builds every package,
# signs the updater artifacts and publishes them with latest.json. The version's
# pre-release names the update channel, `gpui-preview` or `gpui-experimental`:
# Quadrant-Native never publishes to Quadrant's `stable` or `preview`.
# Submitting latest.json to Quadrant's update server (app `quadrant-native`)
# runs when the repository variable SUBMIT_UPDATES is `true`. Signing and
# latest.json are skipped when TAURI_SIGNING_PRIVATE_KEY isn't set. See README,
# "Releasing".
on:
  push:
    tags:
      - "v*-gpui-preview*"
      - "v*-gpui-experimental*"

permissions:
  contents: read

# Never cancel a release in flight; this only keeps one tag from building twice
# at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_INCREMENTAL: "0"
  # The repository whose GitHub release carries the downloads: this public
  # one, unless the optional RELEASES_REPO variable names another (then
  # RELEASES_REPO_TOKEN needs write access to it).
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
  # Where latest.json says the files are. Defaults to RELEASES_REPO's release;
  # the optional ASSET_BASE_URL variable serves them from elsewhere (then
  # publishing there is up to you), as `<base>/<tag>/<file>`.
  ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL || format('https://github.com/{0}/releases/download', vars.RELEASES_REPO || github.repository) }}
  TAURI_CLI: "@tauri-apps/cli@2.11.5"
  # Bump on purpose, in validate.yml too.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag against Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml's version $crate"
            exit 1
          fi
          # 26.11.1-gpui-preview.1 -> gpui-preview
          channel="${version#*-}"
          channel="${channel%%.*}"
          case "$channel" in
            gpui-preview | gpui-experimental) ;;
            *)
              echo "::error::$TAG's channel $channel isn't gpui-preview or gpui-experimental"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          create() {
            if GH_TOKEN="$1" gh release view "$TAG" --repo "$2" >/dev/null 2>&1; then
              return
            fi
            # gpui-preview is Quadrant-Native's stable line, so it is a full
            # release (and the latest); gpui-experimental is a pre-release.
            if [ "$CHANNEL" = gpui-experimental ]; then flags=(--prerelease); else flags=(--latest); fi
            GH_TOKEN="$1" gh release create "$TAG" --repo "$2" --target "$GITHUB_SHA" \
              --title "Quadrant-Native v$VERSION" \
              --notes "See the assets to download this version and install. Check out the [changelog on my blog](https://blog.mrquantumoff.dev)" \
              "${flags[@]}"
          }
          create "$GH_TOKEN" "$GITHUB_REPOSITORY"
          if [ "$RELEASES_REPO" != "$GITHUB_REPOSITORY" ]; then
            create "$PUBLIC_TOKEN" "$RELEASES_REPO"
          fi

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            platform: linux
            arch: x86_64
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            platform: linux
            arch: aarch64
          - os: blacksmith-4vcpu-windows-2025
            platform: windows
            arch: x86_64
          - os: windows-11-arm
            platform: windows
            arch: aarch64
          - os: macos-latest
            platform: darwin
            arch: aarch64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # linuxdeploy runs as an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev pkg-config file

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # From crates.io rather than a GitHub release download, which 504s now
      # and then; rust-cache keeps ~/.cargo/bin, so later runs skip the build.
      - name: Install the packagers
        run: |
          bash scripts/retry.sh cargo install --locked cargo-packager@0.11.8
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/retry.sh cargo install --locked cargo-generate-rpm@0.21.1
          fi

      # The only step that needs the credentials: they are compiled into the
      # binary, so no other step (or action) is handed them.
      - name: Build
        env:
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
        run: |
          features=updater
          # CurseForge needs the API token at compile time, as in Quadrant's release.
          if [ -n "$ETERNAL_API_TOKEN" ]; then features="$features,curseforge"; fi
          cargo build --release --locked --features "$features"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          # It downloads NSIS from a GitHub release.
          bash scripts/retry.sh cargo packager --release -f nsis
          mkdir -p dist
          cp target/release/quadrant-native_*-setup.exe dist/
          setup=$(cd dist && ls quadrant-native_*-setup.exe)
          echo "UPDATER=nsis=$setup" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # It downloads AppRun and linuxdeploy from GitHub releases.
          bash scripts/retry.sh cargo packager --release -f deb,appimage
          # rpm versions and releases can't contain '-': 26.11.1-gpui-preview.1
          # is version 26.11.1, release gpui_preview.1.
          release="${VERSION#*-}"
          cargo generate-rpm -s "version = \"${VERSION%%-*}\"" -s "release = \"${release//-/_}\""
          mkdir -p dist
          cp target/release/quadrant-native_*.deb target/release/quadrant-native_*.AppImage target/generate-rpm/quadrant-native-*.rpm dist/
          cd dist
          echo "UPDATER=appimage=$(ls *.AppImage) deb=$(ls *.deb) rpm=$(ls *.rpm)" >> "$GITHUB_ENV"

      # Ad-hoc signed like Quadrant's macOS build: no Developer ID yet.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/retry.sh cargo packager --release -f app
          app=target/release/Quadrant-Native.app
          codesign --force --deep --sign - "$app"
          mkdir -p dist dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Quadrant-Native -srcfolder dmg -ov -format UDZO "dist/Quadrant-Native_${VERSION}_aarch64.dmg"
          tar -czf "dist/Quadrant-Native_${VERSION}_aarch64.app.tar.gz" -C target/release Quadrant-Native.app
          echo "UPDATER=app=Quadrant-Native_${VERSION}_aarch64.app.tar.gz" >> "$GITHUB_ENV"

      # Tauri's signer, with Quadrant's updater key: one secret signs both apps.
      - name: Sign the updater artifacts
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          entries=()
          for pair in $UPDATER; do
            variant="${pair%%=*}"
            file="${pair#*=}"
            npx --yes "$TAURI_CLI" signer sign "$file"
            signature=$(cat "$file.sig")
            entry="{\"signature\":\"$signature\",\"url\":\"$ASSET_BASE_URL/$TAG/$file\"}"
            entries+=("\"$PLATFORM-$ARCH-$variant\":$entry")
            # The plain key is what a client without a variant gets: the
            # first artifact, the AppImage on Linux, as in Tauri's latest.json.
            if [ ${#entries[@]} -eq 1 ]; then entries+=("\"$PLATFORM-$ARCH\":$entry"); fi
          done
          (IFS=,; echo "{${entries[*]}}") > "../platforms-$PLATFORM-$ARCH.json"
          cat "../platforms-$PLATFORM-$ARCH.json"

      - name: Upload to the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$RELEASES_REPO" != "$GITHUB_REPOSITORY" ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$TAG" dist/* --repo "$RELEASES_REPO" --clobber
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: platforms-${{ matrix.platform }}-${{ matrix.arch }}
          path: platforms-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: ignore

  manifest:
    needs: [prepare, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: platforms-*
          merge-multiple: true

      - name: Assemble latest.json
        id: latest
        run: |
          if ! ls platforms-*.json >/dev/null 2>&1; then
            echo "::notice::No signed updater artifacts (TAURI_SIGNING_PRIVATE_KEY isn't set), so no latest.json."
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          jq -s --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: "See the assets to download this version and install.", pub_date: $date, platforms: add}' \
            platforms-*.json > latest.json
          cat latest.json

      - name: Upload latest.json
        if: steps.latest.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$RELEASES_REPO" != "$GITHUB_REPOSITORY" ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$TAG" latest.json --repo "$RELEASES_REPO" --clobber
          fi

      # Only when SUBMIT_UPDATES is `true`. As with Quadrant's releases, the
      # release arrives unpublished, on either channel, and RelMan publishes it.
      - name: Submit the release to the update server
        if: vars.SUBMIT_UPDATES == 'true' && steps.latest.outputs.built == 'true'
        env:
          TOKEN: ${{ secrets.VERSION_UPDATE_TRIGGER_TOKEN }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          curl --fail-with-body -X PUT \
            -H "Authorization: $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://api.usequadrant.dev/api/any/quadrant-native/add_updates/$CHANNEL/$TAG"
