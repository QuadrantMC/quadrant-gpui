[package]
name = "quadrant-native"
# YY.MM.REVISION with the release channel as the pre-release, like Quadrant.
# The release tag is `v` plus this version.
version = "26.11.0-stable"
edition = "2024"
description = "Manage your mods and modpacks with ease."
authors = ["MrQuantumOFF (Demir Yerli) <me@mrquantumoff.dev>"]
homepage = "https://usequadrant.dev"
license = "MPL-2.0"
publish = false

[features]
default = []
curseforge = ["quadrant-host/curseforge"]
# Adds `--screenshot <dir>`, which renders the window to PNGs for visual checks.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]
# Adds `--perf <scenario|all>`, which drives the window and records its frame times.
perf = []
# The self-updater: checks Quadrant's update server for quadrant-native and
# installs signed releases. Release CI turns it on; dev builds leave it off.
updater = ["dep:base64", "dep:minisign-verify", "dep:serde"]
# Perf mode plus gpui's profiler, which adds where each run's time went to its
# JSON. For diagnosis only: the profiler's overhead skews the frame times.
perf-profile = ["perf", "gpui/profiler"]

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
# Already in the tree through gpui; runs the mod catalog's requests side by side.
futures = "0.3"
getrandom = "0.3"
# Already in the tree through gpui; decodes the tray icon.
image = { version = "0.25", default-features = false, features = ["png"] }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = "0.7.3"
gpui-kit-assets = "0.7.3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland"] }
log = "0.4"
minisign-verify = { version = "0.3", optional = true }
quadrant-core = { git = "https://github.com/QuadrantMC/quadrant", rev = "e4c92d873ffbc1d48a025cfc251adbd29fa02b21" }
quadrant-host = { git = "https://github.com/QuadrantMC/quadrant", rev = "e4c92d873ffbc1d48a025cfc251adbd29fa02b21" }
# Already in the tree through quadrant-core; fetches remote images for `img(url)`.
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
# Already in the tree through gpui; a type in gpui's platform interface.
smallvec = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
# Already in the tree through gpui. The tray hides and shows the window by
# its handle, perf mode times frames from the window procedure; `console`
# attaches a console for --debug and shows fatal errors.
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# The tray icon the window hides into: Windows' notification area and the
# macOS menu bar.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# A StatusNotifierItem over D-Bus for Linux trays, Wayland included; no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
# gpui's test window, for tests that draw, resize and scroll real lists.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
# Already in the tree through gpui; embeds the icon in the Windows exe.
embed-resource = "3"

# Uncomment to build against a sibling checkout of the quadrant repo instead of
# the pinned upstream revision.
# [patch."https://github.com/QuadrantMC/quadrant"]
# quadrant-core = { path = "../quadrant/src-tauri/crates/quadrant-core" }
# quadrant-host = { path = "../quadrant/src-tauri/crates/quadrant-host" }

# cargo-packager 0.11 (`cargo install cargo-packager --locked`). Build the
# binary first (`cargo build --release --features updater`), then run
# `cargo packager --release -f <formats>`. See README, "Packaging".
[package.metadata.packager]
product-name = "Quadrant-Native"
identifier = "dev.mrquantumoff.quadrant-native"
publisher = "MrQuantumOFF (Demir Yerli)"
copyright = "Copyright © 2026 MrQuantumOFF (Demir Yerli)"
category = "Utility"
long-description = "This is a powerful tool to manage your Minecraft: Java Edition mods. With this app you can easily install mods, resourcepacks, shaders. You can also share you modpacks with your friends, and you can back up your modpacks to the cloud!"
license-file = "LICENSE"
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/128x128.png",
  "packaging/icons/256x256.png",
  "packaging/icons/512x512.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]
binaries = [{ path = "quadrant-native", main = true }]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "packaging/icons/icon.ico"

[package.metadata.packager.macos]
minimum-system-version = "11.0"

# gpui opens libwayland-client, libwayland-egl and Vulkan at runtime; ldd
# only shows libxkbcommon. xdg-open opens links and the sign-in page.
[package.metadata.packager.deb]
section = "utils"
depends = ["libxkbcommon0", "libwayland-client0", "libwayland-egl1", "libvulkan1", "xdg-utils"]
# Also the AppImage's. Its name matches the Wayland app id.
desktop-template = "packaging/linux/quadrant-native.desktop"

# cargo-packager makes no rpm; `cargo generate-rpm` (cargo-generate-rpm)
# packs the same files from target/release.
[package.metadata.generate-rpm]
summary = "Manage your mods and modpacks with ease."
assets = [
  { source = "target/release/quadrant-native", dest = "/usr/bin/quadrant-native", mode = "755" },
  { source = "packaging/linux/quadrant-native.desktop", dest = "/usr/share/applications/quadrant-native.desktop", mode = "644" },
  { source = "packaging/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/quadrant-native.png", mode = "644" },
  { source = "packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/quadrant-native.png", mode = "644" },
  { source = "packaging/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/quadrant-native.png", mode = "644" },
  { source = "packaging/icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/quadrant-native.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libwayland-client = "*"
libwayland-egl = "*"
vulkan-loader = "*"
xdg-utils = "*"
