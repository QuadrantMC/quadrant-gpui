[package]
name = "quadrant-native"
# YY.MM.REVISION with the release channel as the pre-release, like Quadrant.
# The release tag is `v` plus this version.
version = "26.10.0-stable"
edition = "2024"
description = "Manage your mods and modpacks with ease."
authors = ["MrQuantumOFF (Demir Yerli) <me@mrquantumoff.dev>"]
homepage = "https://usequadrant.dev"
license = "MPL-2.0"
publish = false

[features]
default = []
curseforge = ["quadrant-host/curseforge"]
# Adds `--screenshot <dir>`, which renders the window to PNGs for visual checks.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]
# Adds `--perf <scenario|all>`, which drives the window and records its frame times.
perf = ["dep:raw-window-handle", "dep:windows"]
# The self-updater: checks Quadrant's update server for quadrant-native and
# installs signed releases. Release CI turns it on; dev builds leave it off.
updater = ["dep:base64", "dep:minisign-verify", "dep:serde"]
# Perf mode plus gpui's profiler, which adds where each run's time went to its
# JSON. For diagnosis only: the profiler's overhead skews the frame times.
perf-profile = ["perf", "gpui/profiler"]

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
getrandom = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = "0.7.3"
gpui-kit-assets = "0.7.3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland"] }
log = "0.4"
minisign-verify = { version = "0.3", optional = true }
quadrant-core = { git = "https://github.com/QuadrantMC/quadrant", rev = "5957faf11733163e5272cc756cc227905a6080ae" }
quadrant-host = { git = "https://github.com/QuadrantMC/quadrant", rev = "5957faf11733163e5272cc756cc227905a6080ae" }
# Already in the tree through quadrant-core; fetches remote images for `img(url)`.
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
# Already in the tree through gpui; perf mode times frames from the window procedure.
raw-window-handle = { version = "0.6", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# Already in the tree through gpui; embeds the icon in the Windows exe.
embed-resource = "3"

# Uncomment to build against a sibling checkout of the quadrant repo instead of
# the pinned upstream revision.
# [patch."https://github.com/QuadrantMC/quadrant"]
# quadrant-core = { path = "../quadrant/src-tauri/crates/quadrant-core" }
# quadrant-host = { path = "../quadrant/src-tauri/crates/quadrant-host" }

# cargo-packager 0.11 (`cargo install cargo-packager --locked`). Build the
# binary first (`cargo build --release --features updater`), then run
# `cargo packager --release -f <formats>`. See README, "Packaging".
[package.metadata.packager]
product-name = "Quadrant-Native"
identifier = "dev.mrquantumoff.quadrant-native"
publisher = "MrQuantumOFF (Demir Yerli)"
copyright = "Copyright © 2026 MrQuantumOFF (Demir Yerli)"
category = "Utility"
long-description = "This is a powerful tool to manage your Minecraft: Java Edition mods. With this app you can easily install mods, resourcepacks, shaders. You can also share you modpacks with your friends, and you can back up your modpacks to the cloud!"
license-file = "LICENSE"
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/128x128.png",
  "packaging/icons/256x256.png",
  "packaging/icons/512x512.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]
binaries = [{ path = "quadrant-native", main = true }]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "packaging/icons/icon.ico"

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.deb]
section = "utils"
